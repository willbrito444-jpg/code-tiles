<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Tiles</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bgred"></div>
<div id="app">
  <div id="hud">
    <span>tiles <b id="score">0</b> <span id="proj" style="color:var(--dim)"></span></span>
    <b id="timer">30.0</b>
    <span class="r">best <b id="best">0</b></span>
  </div>
  <div id="mpbar"></div>
  <div id="field" tabindex="0">
    <canvas id="c"></canvas>
    <div id="msg"></div>
  </div>
  <div id="pad">
    <button data-l="0">(<small>G</small></button>
    <button data-l="1">[<small>H</small></button>
    <button data-l="2">{<small>J</small></button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
