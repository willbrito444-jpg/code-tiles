<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Tiles</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0d12; --line:#1f2731; --fg:#d7dee8; --dim:#6b7684; --acc:#5cc8ff; --bad:#ff5c6c; --gold:#ffcc4d; --good:#4ade80; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:radial-gradient(1200px 600px at 50% -10%, #152030 0%, var(--bg) 60%); color:var(--fg); font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace; user-select:none; touch-action:none; }
  #app { max-width:760px; margin:0 auto; height:100%; display:flex; flex-direction:column; padding:10px; gap:8px; position:relative; z-index:1; }
  #hud { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; font-size:13px; color:var(--dim); }
  #hud .r { text-align:right; }
  #hud b { color:var(--fg); font-size:18px; font-weight:800; }
  #score { color:var(--acc); font-size:22px; }
  #timer { font-size:36px; color:#fff; display:inline-block; transform-origin:center; }
  #timer.warn { color:#ffa657; animation:bounce .6s ease-in-out infinite; text-shadow:0 0 18px rgba(255,166,87,.6); }
  #timer.low { color:var(--bad); animation:bounce .3s ease-in-out infinite, wobble .5s linear infinite; text-shadow:0 0 24px rgba(255,92,108,.8); font-size:44px; }
  @keyframes bounce { 0%,100%{ transform:translateY(0) scale(1); } 50%{ transform:translateY(-6px) scale(1.15); } }
  @keyframes wobble { 0%{ rotate:-6deg } 50%{ rotate:6deg } 100%{ rotate:-6deg } }
  #bgred { position:fixed; inset:0; background:radial-gradient(900px 700px at 50% 50%, #7a1020 0%, #3a0810 60%, #1a0408 100%); opacity:0; pointer-events:none; z-index:0; }
  #field { position:relative; flex:1; min-height:0; background:#0b1017; border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.5); outline:none; }
  canvas { width:100%; height:100%; display:block; }
  #msg { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:12px; padding:24px; background:rgba(10,13,18,.9); backdrop-filter:blur(4px); overflow:auto; }
  #msg h1 { margin:0; font-size:34px; font-weight:800; letter-spacing:-1px; background:linear-gradient(90deg,var(--acc),#c084fc,var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #msg p { margin:0; color:var(--dim); font-size:13px; line-height:1.7; max-width:340px; }
  #msg .big { font-size:48px; font-weight:800; color:var(--acc); }
  kbd { display:inline-block; padding:1px 7px; border:1px solid #2b3440; border-bottom-width:3px; border-radius:6px; background:#161d27; color:var(--fg); font-size:12px; }
  button { font:inherit; cursor:pointer; border:1px solid #273039; background:linear-gradient(180deg,#1b232e,#141b24); color:var(--fg); border-radius:10px; }
  #start { padding:12px 28px; font-size:16px; background:linear-gradient(180deg,var(--acc),#2f9fe0); color:#06111a; border:0; font-weight:800; box-shadow:0 6px 20px rgba(92,200,255,.35); }
  #modes { display:flex; gap:6px; }
  #modes button { padding:8px 16px; font-size:14px; font-weight:800; color:var(--dim); display:flex; flex-direction:column; align-items:center; gap:2px; min-width:72px; }
  #modes button span { font-size:30px; line-height:1; filter:grayscale(1) opacity(.6); transition:transform .15s, filter .15s; }
  #modes button.on span { filter:none; transform:scale(1.2); }
  #modes button.on { color:#06111a; background:var(--gold); border-color:var(--gold); }
  #mascot { font-size:84px; line-height:1; display:flex; align-items:center; justify-content:center; width:320px; height:130px; }
  #mascot.m10 { animation:bound .5s infinite alternate; }
  #mascot.m20 { animation:bound .85s infinite alternate; }
  #mascot.m30 { animation:bound 1.4s infinite alternate; }
  @keyframes bound {
    0%   { transform:translate(-45px,-34px) scale(1.25) rotate(-8deg); animation-timing-function:ease-in; }
    50%  { transform:translate(  0px, 10px) scale(.8)   rotate(0deg) scaleY(.85); animation-timing-function:ease-out; }
    100% { transform:translate( 45px,-34px) scale(1.25) rotate(8deg); }
  }
  #lb { width:300px; max-width:100%; text-align:left; font-size:12px; border:1px solid var(--line); border-radius:10px; padding:8px 10px; background:rgba(255,255,255,.02); }
  #lb .lbt { color:var(--gold); font-weight:800; margin-bottom:4px; display:flex; justify-content:space-between; }
  #lb .lbt span { color:var(--dim); font-weight:500; }
  #lb .tabs { display:flex; gap:4px; margin-bottom:6px; }
  #lb .tabs button { flex:1; padding:4px 0; font-size:11px; font-weight:800; color:var(--dim); border-radius:6px; }
  #lb .tabs button.on { color:#06111a; background:var(--acc); border-color:var(--acc); }
  #lb ol { margin:0; padding-left:22px; max-height:150px; overflow:auto; }
  #lb li { display:flex; justify-content:space-between; gap:8px; color:var(--fg); }
  #lb li.me { color:var(--acc); font-weight:800; }
  #lb .empty { color:var(--dim); }
  #submit { display:flex; gap:6px; }
  #submit input { font:inherit; padding:8px 10px; border:1px solid #273039; border-radius:8px; background:#0e141b; color:var(--fg); width:150px; }
  #submit button { padding:8px 12px; font-size:12px; font-weight:800; color:var(--gold); }
  #submit .ok { color:var(--good); font-size:12px; align-self:center; }
  #keys { display:flex; gap:8px; align-items:center; font-size:12px; color:var(--dim); }
  #keys button { padding:6px 0; width:52px; font-size:16px; font-weight:800; text-transform:uppercase; }
  #keys button.listen { border-color:var(--gold); color:var(--gold); animation:blinkb .5s steps(2,start) infinite; }
  #keys button.reset { width:auto; padding:6px 10px; font-size:11px; text-transform:none; color:var(--dim); }
  @keyframes blinkb { to { border-color:transparent; } }
  #pad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  #pad button { padding:16px 0; font-size:20px; font-weight:800; position:relative; }
  #pad button small { position:absolute; bottom:3px; right:7px; font-size:9px; color:var(--dim); font-weight:500; }
  #pad button:nth-child(1){ color:#5cc8ff } #pad button:nth-child(2){ color:#c084fc } #pad button:nth-child(3){ color:#ffa657 }
</style>
</head>
<body>
<div id="bgred"></div>
<div id="app">
  <div id="hud">
    <span>tiles <b id="score">0</b> <span id="proj" style="color:var(--dim)"></span></span>
    <b id="timer">30.0</b>
    <span class="r">best <b id="best">0</b></span>
  </div>
  <div id="field" tabindex="0">
    <canvas id="c"></canvas>
    <div id="msg"></div>
  </div>
  <div id="pad">
    <button data-l="0">(<small>G</small></button>
    <button data-l="1">[<small>H</small></button>
    <button data-l="2">{<small>J</small></button>
  </div>
</div>
<script>
(() => {
  // ---- leaderboard backend (Supabase) ----------------------------------
  const SUPABASE = { url: 'https://taugktxsoxjvospvugsz.supabase.co', key: 'sb_publishable__j-BvKxt03-gRKuMF0pcHg_hgRg4GxF' };

  const cv=document.getElementById('c'), ctx=cv.getContext('2d'), $=id=>document.getElementById(id), field=$('field');
  const LANES=3, COL=['#5cc8ff','#c084fc','#ffa657'], GLYPH=['(','[','{'];
  const DEFAULT_BINDS=['g','h','j'];
  let BINDS=[...DEFAULT_BINDS]; try{ const s=JSON.parse(localStorage.getItem('codeTilesBinds')||'null'); if(Array.isArray(s)&&s.length===3) BINDS=s; }catch(e){}
  let KEY={}; let listening=-1;
  function rebuildKeys(){ KEY={arrowleft:0,arrowdown:1,arrowright:2}; BINDS.forEach((k,i)=>KEY[k]=i); document.querySelectorAll('#pad button').forEach((b,i)=>b.querySelector('small').textContent=keyLabel(BINDS[i]).toUpperCase()); }
  function keyLabel(k){ return k===' '?'spc':k.replace('arrow','').slice(0,5); }
  const KEYS_HTML=()=>'<div id="keys">keys: '+[0,1,2].map(i=>'<button data-k="'+i+'" style="color:'+COL[i]+'">'+keyLabel(BINDS[i])+'</button>').join('')+'<button class="reset">reset</button></div>';
  function bindKeys(){
    document.querySelectorAll('#keys button[data-k]').forEach(b=>b.addEventListener('click',()=>{ listening=+b.dataset.k; document.querySelectorAll('#keys button').forEach(x=>x.classList.remove('listen')); b.classList.add('listen'); b.textContent='...'; }));
    const r=document.querySelector('#keys button.reset'); if(r) r.addEventListener('click',()=>{ BINDS=[...DEFAULT_BINDS]; saveBinds(); });
  }
  function saveBinds(){ try{localStorage.setItem('codeTilesBinds',JSON.stringify(BINDS));}catch(e){} rebuildKeys(); const k=$('keys'); if(k) k.outerHTML=KEYS_HTML(); bindKeys(); listening=-1; field.focus(); }

  // ---- shared leaderboard ---------------------------------------------
  const LB_ON = !!(SUPABASE.url && SUPABASE.key);
  let pid=''; try{ pid=localStorage.getItem('codeTilesPid'); if(!pid){ pid=Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('codeTilesPid',pid); } }catch(e){ pid='anon'; }
  let myName=''; try{ myName=localStorage.getItem('codeTilesName')||''; }catch(e){}
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let lbTab='day'; try{ lbTab=localStorage.getItem('codeTilesLbTab')||'day'; }catch(e){}
  const cache={};
  function sinceIso(tab){
    const d=new Date();
    if(tab==='day'){ d.setHours(0,0,0,0); return d.toISOString(); }
    if(tab==='week'){ const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); d.setHours(0,0,0,0); return d.toISOString(); }
    return null;
  }
  async function fetchBoard(mode,tab){
    const k=mode+'|'+tab, c=cache[k]; if(c&&Date.now()-c.t<15000) return c.rows;
    let q=SUPABASE.url+'/rest/v1/scores?select=name,score,pid&mode=eq.'+mode+'&order=score.desc&limit=50';
    const s=sinceIso(tab); if(s) q+='&created_at=gte.'+encodeURIComponent(s);
    const r=await fetch(q,{headers:{apikey:SUPABASE.key,Authorization:'Bearer '+SUPABASE.key}});
    if(!r.ok) throw new Error('board '+r.status);
    const seen=new Map(); for(const row of await r.json()){ if(!seen.has(row.pid)) seen.set(row.pid,row); }
    const rows=[...seen.values()].slice(0,10); cache[k]={t:Date.now(),rows}; return rows;
  }
  function LB_HTML(body){
    const tabs='<div class="tabs">'+[['day','today'],['week','this week'],['all','all time']].map(t=>'<button data-tab="'+t[0]+'"'+(lbTab===t[0]?' class="on"':'')+'>'+t[1]+'</button>').join('')+'</div>';
    return '<div id="lb"><div class="lbt">leaderboard <span>'+DURATION+'s mode</span></div>'+tabs+'<div id="lbbody">'+body+'</div></div>';
  }
  let lbReq=0;
  function renderLb(){
    const el=$('lb'); if(!el) return;
    if(!LB_ON){ el.outerHTML=LB_HTML('<div class="empty">leaderboard not configured</div>'); return; }
    el.outerHTML=LB_HTML('<div class="empty">loading…</div>');
    const req=++lbReq, mode=DURATION, tab=lbTab;
    fetchBoard(mode,tab).then(rows=>{
      if(req!==lbReq) return; const b=$('lbbody'); if(!b) return;
      if(!rows.length){ b.innerHTML='<div class="empty">no scores '+(tab==='day'?'today':tab==='week'?'this week':'yet')+'. be the first!</div>'; return; }
      b.innerHTML='<ol>'+rows.map(r=>'<li'+(r.pid===pid?' class="me"':'')+'><span>'+esc((r.name||'anon').slice(0,16))+'</span><b>'+(r.score|0)+'</b></li>').join('')+'</ol>';
    }).catch(()=>{ const b=$('lbbody'); if(b) b.innerHTML='<div class="empty">couldn\'t load the board</div>'; });
  }
  document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('#lb button[data-tab]'); if(!b) return; lbTab=b.dataset.tab; try{localStorage.setItem('codeTilesLbTab',lbTab);}catch(x){} renderLb(); field.focus(); });
  function SUBMIT_HTML(){
    if(!LB_ON||score<=0||!pbThisRun) return '';
    return '<div id="submit"><input id="nm" maxlength="16" placeholder="your name" value="'+esc(myName)+'"><button id="sub">save to leaderboard</button></div>';
  }
  function bindSubmit(){
    const b=$('sub'); if(!b) return;
    b.addEventListener('click',async()=>{
      const name=($('nm').value.trim()||'anon').slice(0,16); myName=name; try{localStorage.setItem('codeTilesName',name);}catch(e){}
      b.disabled=true; b.textContent='saving…';
      try{
        const r=await fetch(SUPABASE.url+'/rest/v1/scores',{method:'POST',headers:{apikey:SUPABASE.key,Authorization:'Bearer '+SUPABASE.key,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({pid,name,mode:DURATION,score})});
        if(!r.ok) throw new Error(r.status);
        for(const k in cache) delete cache[k];
        $('submit').innerHTML='<span class="ok">saved to leaderboard ✓</span>'; renderLb();
      }catch(e){ $('submit').innerHTML='<span class="empty" style="color:var(--dim)">couldn\'t save, try again later</span>'; }
      field.focus();
    });
  }

  // ---- game -------------------------------------------------------------
  let DURATION=30; const FREEZE_BY_MODE={10:.5,20:1,30:2}, TILE_H=100, SLIDE_SPEED=1000;
  const FREEZE=()=>FREEZE_BY_MODE[DURATION]||1;
  try{ DURATION=+localStorage.getItem('codeTilesMode')||30; }catch(e){}
  let W=0,H=0,dpr=1, tiles=[];
  let frozenTotal=0, pbThisRun=false;
  let score=0,best=0,timeLeft=DURATION,running=false,started=false,last=0,freeze=0,wrongLane=-1,offset=0,note=0,lastLane=-1;
  function loadBest(){ best=0; try{ best=+localStorage.getItem('codeTilesSprint'+DURATION)||0; }catch(e){} $('best').textContent=best; }
  function setMode(d){
    DURATION=d; try{localStorage.setItem('codeTilesMode',d);}catch(e){}
    document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',+b.dataset.d===d));
    const m=$('mascot'); if(m){ m.textContent={10:'🏎️',20:'🐇',30:'🐢'}[d]; m.className='m'+d; }
    loadBest(); timeLeft=DURATION; hud(); renderLb();
  }
  const MODES_HTML='<div id="modes"><button data-d="10"><span>🏎️</span>10s</button><button data-d="20"><span>🐇</span>20s</button><button data-d="30"><span>🐢</span>30s</button></div>';
  function bindModes(){ document.querySelectorAll('#modes button').forEach(b=>b.addEventListener('click',()=>{ setMode(+b.dataset.d); field.focus(); })); }

  let AC=null;
  function beep(f,d=.08,type='square',g=.08){ if(!AC)return; try{const o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(g,AC.currentTime);v.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(v).connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){} }
  const NOTES=[262,294,330,349,392,440,494,523,587,659];

  function resize(){ const r=cv.getBoundingClientRect(); dpr=devicePixelRatio||1; W=r.width;H=r.height; cv.width=W*dpr;cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  addEventListener('resize',resize); resize();
  function projected(){ const active=(DURATION-timeLeft)-frozenTotal; return active>0.5 ? Math.round(score/active*DURATION) : null; }
  function hud(){ $('score').textContent=score; const p=projected(); $('proj').textContent=p!==null?'('+p+')':''; const tm=$('timer'); tm.textContent=Math.max(0,timeLeft).toFixed(1); const low=running&&timeLeft<=5, warn=running&&timeLeft>5&&timeLeft<=10; tm.classList.toggle('low',low); tm.classList.toggle('warn',warn); $('bgred').style.opacity = running ? Math.min(1, Math.max(0, (10-timeLeft)/10)) : 0; }

  function addTile(){ let lane; do{ lane=Math.floor(Math.random()*LANES); }while(lane===lastLane && Math.random()<.6); lastLane=lane; tiles.push(lane); }
  function start(){
    try{ if(!AC)AC=new (AudioContext||webkitAudioContext)(); AC.resume(); }catch(e){}
    tiles=[];score=0;timeLeft=DURATION;freeze=0;frozenTotal=0;wrongLane=-1;offset=0;note=0;running=true;started=false;pbThisRun=false;last=performance.now();
    for(let i=0;i<20;i++) addTile();
    $('msg').style.display='none'; hud(); resize(); field.focus(); requestAnimationFrame(loop);
  }
  function over(){
    running=false; beep(523,.15,'triangle',.1); setTimeout(()=>beep(659,.15,'triangle',.1),120); setTimeout(()=>beep(784,.3,'triangle',.1),240);
    const pb=score>best; pbThisRun=pb; if(pb){best=score;try{localStorage.setItem('codeTilesSprint'+DURATION,best);}catch(e){} $('best').textContent=best;}
    $('msg').innerHTML='<div id="mascot"></div><h1>'+(pb?'New PB!':'Time!')+'</h1><div class="big">'+score+'</div><p>tiles in '+DURATION+' s · '+(score/DURATION).toFixed(1)+' per second · best '+best+(frozenTotal>0?'<br>projected without the '+frozenTotal.toFixed(0)+' s frozen: <b>'+(projected()??score)+'</b>':'')+'</p>'+SUBMIT_HTML()+LB_HTML('')+MODES_HTML+'<button id="start">Again</button><p><kbd>Space</kbd> or <kbd>Enter</kbd> to restart · <kbd>Esc</kbd> home</p>';
    $('msg').style.display='flex'; $('start').onclick=start; bindModes(); bindSubmit(); setMode(DURATION);
  }
  function home(){
    running=false; started=false; freeze=0; frozenTotal=0; offset=0; tiles=[]; score=0; timeLeft=DURATION;
    $('msg').innerHTML='<div id="mascot"></div><h1>Code Tiles</h1>'+MODES_HTML+'<p>Hit as many tiles as you can before the clock runs out.<br>Press the key for the lowest tile\'s lane. Each hit climbs one step.</p><p>Click a key below to rebind it (arrows also work) · or tap a lane</p><p>A wrong key <b style="color:#bfe8ff">freezes you</b> while the clock keeps running: 0.5 s in 10s mode, 1 s in 20s, 2 s in 30s.</p><button id="start">Start</button>'+KEYS_HTML()+LB_HTML('')+'<p><kbd>Space</kbd> or <kbd>Enter</kbd> to start · <kbd>R</kbd> restarts · <kbd>Esc</kbd> home</p>';
    $('msg').style.display='flex'; $('start').onclick=start; bindModes(); bindKeys(); setMode(DURATION); hud(); draw();
  }

  function laneX(l){ return l*W/LANES; }
  function press(l){
    if(!running) return;
    if(freeze>0) return;
    started=true;
    if(tiles[0]===l){ tiles.shift(); addTile(); score++; offset+=TILE_H; beep(NOTES[note++%NOTES.length],.1,'triangle',.08); if(wrongLane>=0) wrongLane=-1; }
    else { freeze=FREEZE(); wrongLane=l; beep(110,.3,'sawtooth',.1); }
    hud();
  }
  addEventListener('keydown',e=>{
    if(e.metaKey||e.ctrlKey||e.altKey)return;
    if(e.target&&e.target.tagName==='INPUT'){ if(e.key==='Enter'){ const b=$('sub'); if(b) b.click(); } return; }
    if(listening>=0){
      e.preventDefault(); const k=e.key.toLowerCase();
      if(k==='escape'){ listening=-1; saveBinds(); return; }
      if(['enter','r',' '].includes(k)) return;
      const other=BINDS.indexOf(k); if(other>=0&&other!==listening) BINDS[other]=BINDS[listening];
      BINDS[listening]=k; saveBinds(); return;
    }
    if(e.key.toLowerCase()==='r'){e.preventDefault();start();return;}
    if(e.key==='Escape'){e.preventDefault();home();return;}
    const l=KEY[e.key.toLowerCase()];
    if(l!==undefined){e.preventDefault();press(l);}
    else if(!running&&(e.key==='Enter'||e.key===' ')){e.preventDefault();const s=$('start');if(s)s.click();}
  });
  field.addEventListener('pointerdown',e=>{ field.focus(); if(!running)return; const r=cv.getBoundingClientRect(); press(Math.min(LANES-1,Math.floor((e.clientX-r.left)/r.width*LANES))); });
  document.querySelectorAll('#pad button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();press(+b.dataset.l);field.focus();}));

  function loop(now){
    if(!running)return;
    const dt=Math.min((now-last)/1000,.05); last=now;
    if(started) timeLeft-=dt;
    offset=Math.max(0, offset-SLIDE_SPEED*dt);
    if(freeze>0){ frozenTotal+=Math.min(freeze,dt); freeze-=dt; if(freeze<=0){ freeze=0; wrongLane=-1; } }
    hud(); draw();
    if(timeLeft<=0){ timeLeft=0; hud(); return over(); }
    requestAnimationFrame(loop);
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    const lw=W/LANES;
    for(let l=0;l<LANES;l++){
      ctx.fillStyle=l%2?'rgba(255,255,255,.015)':'rgba(255,255,255,0)'; ctx.fillRect(laneX(l),0,lw,H);
      ctx.strokeStyle='rgba(255,255,255,.06)'; ctx.beginPath(); ctx.moveTo(laneX(l),0); ctx.lineTo(laneX(l),H); ctx.stroke();
    }
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const baseY=H*.65-TILE_H/2;
    ctx.fillStyle='rgba(255,255,255,.05)'; ctx.fillRect(0,baseY-4,W,TILE_H+2);
    for(let i=0;i<tiles.length;i++){
      const y=baseY-i*TILE_H-offset; if(y+TILE_H<0)break;
      const lane=tiles[i], x=laneX(lane)+4, w=lw-8, c=COL[lane];
      ctx.globalAlpha = i===0 ? 1 : Math.max(.35, 1-i*.12);
      const g=ctx.createLinearGradient(0,y,0,y+TILE_H); g.addColorStop(0,c); g.addColorStop(1,c+'99');
      ctx.fillStyle=g; roundRect(x,y,w,TILE_H-6,10); ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.55)'; ctx.font="800 40px 'JetBrains Mono',ui-monospace,monospace"; ctx.fillText(GLYPH[lane],x+w/2,y+TILE_H/2-3);
      if(i===0 && freeze<=0){ ctx.strokeStyle='#fff'; ctx.lineWidth=3; roundRect(x,y,w,TILE_H-6,10); ctx.stroke(); ctx.lineWidth=1; }
      ctx.globalAlpha=1;
    }
    ctx.font="500 12px 'JetBrains Mono',ui-monospace,monospace"; ctx.fillStyle='rgba(255,255,255,.3)';
    BINDS.forEach((k,i)=>ctx.fillText(keyLabel(k).toUpperCase(),laneX(i)+lw/2,H-14));
    if(!started){ ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font="800 16px 'JetBrains Mono',ui-monospace,monospace"; ctx.fillText('press the first key to start the clock',W/2,H*.9); }
    if(freeze>0){
      ctx.fillStyle='rgba(170,220,255,.22)'; ctx.fillRect(0,0,W,H);
      const fr=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.7);
      fr.addColorStop(0,'rgba(220,245,255,0)'); fr.addColorStop(1,'rgba(220,245,255,.55)'); ctx.fillStyle=fr; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=1.5;
      const cx=laneX(wrongLane>=0?wrongLane:1)+lw/2, cy=H*.65;
      for(let i=0;i<9;i++){ const a=i*0.7+0.3, len=60+((i*37)%80); ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*len,cy+Math.sin(a)*len); ctx.stroke(); }
      ctx.fillStyle='rgba(255,255,255,.7)'; ctx.font="800 26px 'JetBrains Mono',ui-monospace,monospace";
      [[.12,.12],[.88,.2],[.1,.8],[.9,.85],[.5,.08]].forEach(p=>ctx.fillText('❄',W*p[0],H*p[1]));
      ctx.fillStyle='#bfe8ff'; ctx.fillText('FROZEN',W/2,H*.38);
      ctx.font="800 64px 'JetBrains Mono',ui-monospace,monospace"; ctx.fillText(freeze.toFixed(1),W/2,H*.5);
    }
  }
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  rebuildKeys(); home();
})();
</script>
